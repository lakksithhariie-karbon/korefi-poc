-wrap:anywhere}.key{color:var(--accent)}.empty{padding:25px;color:var(--muted)}.footer{padding:16px clamp(20px,4vw,46px);border-top:1px solid var(--line);color:var(--muted);font-size:.85rem}.toolbar label{display:block}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

<script id="catalog-data" type="application/json">{"cases": [{"id": "doordash-missing-item", "title": "Missing item", "coverage": "DD-01", "platform": "doordash", "source": "PostgreSQL DB", "verdict": "dispute", "draft": "present", "comment": null, "query": "Check this order’s error charge and help me dispute it.", "notes": null, "criteria": ["The answer identifies the $15.58 total and both reported missing items, Samosa and Rose Falooda, with their individual charges of $4.79 and $10.79.", "The answer directs the operator to the available Dispute charge option and does not imply KoreFi has filed.", "The draft addresses both missing items and requests reversal using the supplied facts or the store's standard checks, without claiming anyone verified that these specific items were packed."], "entryPoint": null, "followUps": [], "raw": "id: doordash-missing-item\ncoverage: DD-01\nsource: PostgreSQL DB\ninput:\n  query: Check this order’s error charge and help me dispute it.\n  page_text: doordash-missing-item.txt\n  capture:\n    platform: doordash\n    order_id: DDEVAL01\n    issue_category: Missing entire item\n    dispute_amount: 15.58\n    structured_facts:\n      disputeStatus: null\n      errorChargeTotal: -15.58\n      errorCharges:\n        - item: Samosa ( 2 Pieces ) (Chaats)\n          amount: -4.79\n          reason: Missing entire item\n        - item: Rose Falooda (Beverages)\n          amount: -10.79\n          reason: Missing entire item\nexpected:\n  recommendation: dispute\n  draft: present\n  customer_comment: null\n  rubric:\n    - id: charge_and_issue\n      criterion: The answer identifies the $15.58 total and both reported missing items, Samosa and Rose Falooda, with their individual charges of $4.79 and $10.79.\n    - id: dispute_route\n      criterion: The answer directs the operator to the available Dispute charge option and does not imply KoreFi has filed.\n    - id: grounded_draft\n      criterion: The draft addresses both missing items and requests reversal using the supplied facts or the store's standard checks, without claiming anyone verified that these specific items were packed.\n"}, {"id": "doordash-already-credited", "title": "Already credited", "coverage": "DD-02", "platform": "doordash", "source": "PostgreSQL DB", "verdict": "do_not_dispute", "draft": "absent", "comment": null, "query": "Check this order’s error charge and help me dispute it.", "notes": null, "criteria": ["The answer leads with DoorDash approving the dispute and showing a $9.59 credit for the charge.", "The answer gives no advice to file again or pursue an appeal or support request for the already-credited charge."], "entryPoint": null, "followUps": [], "raw": "id: doordash-already-credited\ncoverage: DD-02\nsource: PostgreSQL DB\ninput:\n  query: Check this order’s error charge and help me dispute it.\n  page_text: doordash-already-credited.txt\n  capture:\n    platform: doordash\n    order_id: DDEVAL03\n    issue_category: Missing entire item\n    dispute_amount: 9.59\n    structured_facts:\n      disputeStatus: approved\n      errorChargeTotal: -9.59\n      errorCredit: 9.59\n      errorCharges:\n        - item: Rabadi Falooda (Beverages)\n          amount: -9.59\n          reason: Missing entire item\n          disputeStatus: approved\nexpected:\n  recommendation: do_not_dispute\n  draft: absent\n  customer_comment: null\n  rubric:\n    - id: credit_explained\n      criterion: The answer leads with DoorDash approving the dispute and showing a $9.59 credit for the charge.\n    - id: no_refiling\n      criterion: The answer gives no advice to file again or pursue an appeal or support request for the already-credited charge.\n"}, {"id": "doordash-dispute-disabled", "title": "Dispute disabled", "coverage": "DD-03", "platform": "doordash", "source": "PostgreSQL DB", "verdict": "do_not_dispute", "draft": "absent", "comment": null, "query": "Can I dispute this order?", "notes": "The portal controls and charge are curated from the saved capture.", "criteria": ["Lead with the closed route. A disabled button does not allow filing. Do not invent a support or appeal route."], "entryPoint": null, "followUps": [], "raw": "id: doordash-dispute-disabled\ncoverage: DD-03\nsource: PostgreSQL DB\ninput:\n  query: Can I dispute this order?\n  page_text: doordash-dispute-disabled.txt\n  capture:\n    platform: doordash\n    issue_category: Missing item\n    dispute_amount: 15.11\n    structured_facts:\n      disputeStatus: null\n      errorChargeTotal: -15.11\n      errorCharges:\n      - item: Paneer Butter Masala (Roadside Curries)\n        amount: -14.4\n      items:\n      - name: Paneer Butter Masala (Roadside Curries)\n        quantity: 2\n    order_id: DO-DD03-dispute-disabled\nexpected:\n  recommendation: do_not_dispute\n  draft: absent\n  customer_comment: null\n  rubric:\n  - id: closed_route\n    criterion: Lead with the closed route. A disabled button does not allow filing. Do not invent a support\n      or appeal route.\ninput_notes: The portal controls and charge are curated from the saved capture.\n"}, {"id": "doordash-deadline-near", "title": "Deadline near", "coverage": "DD-04", "platform": "doordash", "source": "PostgreSQL DB (adapted)", "verdict": "dispute", "draft": "present", "comment": null, "query": "help me dispute", "notes": "Real missing-item charge with a hypothetical portal deadline for this variant.", "criteria": ["Say the dispute route is open and one day remains, without substituting a deadline based on the evaluation date."], "entryPoint": null, "followUps": [], "raw": "id: doordash-deadline-near\ncoverage: DD-04\nsource: PostgreSQL DB (adapted)\ninput:\n  query: help me dispute\n  page_text: doordash-deadline-near.txt\n  capture:\n    platform: doordash\n    issue_category: Missing entire item\n    dispute_amount: 8.39\n    structured_facts:\n      disputeStatus: available\n      errorChargeTotal: -8.39\n      errorCharges:\n      - item: Mango Mastani Lassi (Beverages)\n        amount: -8.39\n        reason: Missing entire item\n      items:\n      - name: Pani-Puri (Chaats)\n        quantity: 1\n      - name: Samosa ( 2 Pieces ) (Chaats)\n        quantity: 1\n      - name: Mango Mastani Lassi (Beverages)\n        quantity: 1\n      - name: Pav Bhaji (Roadside Curries)\n        quantity: 1\n      - name: Vadapav (Chaats)\n        quantity: 1\n    order_id: DO-DD04-deadline-near\nexpected:\n  recommendation: dispute\n  draft: present\n  customer_comment: null\n  rubric:\n  - id: deadline\n    criterion: Say the dispute route is open and one day remains, without substituting a deadline based\n      on the evaluation date.\ninput_notes: Real missing-item charge with a hypothetical portal deadline for this variant.\n"}, {"id": "doordash-deadline-passed", "title": "Deadline passed", "coverage": "DD-04", "platform": "doordash", "source": "PostgreSQL DB (adapted)", "verdict": "do_not_dispute", "draft": "absent", "comment": null, "query": "help me dispute", "notes": "Real missing-item charge with a hypothetical portal deadline for this variant.", "criteria": ["Lead with the expired dispute window and give no filing instructions."], "entryPoint": null, "followUps": [], "raw": "id: doordash-deadline-passed\ncoverage: DD-04\nsource: PostgreSQL DB (adapted)\ninput:\n  query: help me dispute\n  page_text: doordash-deadline-passed.txt\n  capture:\n    platform: doordash\n    issue_category: Missing entire item\n    dispute_amount: 8.39\n    structured_facts:\n      disputeStatus: null\n      errorChargeTotal: -8.39\n      errorCharges:\n      - item: Mango Mastani Lassi (Beverages)\n        amount: -8.39\n        reason: Missing entire item\n      items:\n      - name: Pani-Puri (Chaats)\n        quantity: 1\n      - name: Samosa ( 2 Pieces ) (Chaats)\n        quantity: 1\n      - name: Mango Mastani Lassi (Beverages)\n        quantity: 1\n      - name: Pav Bhaji (Roadside Curries)\n        quantity: 1\n      - name: Vadapav (Chaats)\n        qu  claim a file was uploaded or guarantee recovery."], "entryPoint": null, "followUps": [], "raw": "id: \"doordash-denied-appeal-offered\"\ncoverage: \"DD-06\"\nsource: \"synthetic\"\ninput:\n  query: null\n  page_text: \"doordash-denied-appeal-offered.txt\"\n  capture:\n    platform: \"doordash\"\n    issue_category: \"Missing item\"\n    dispute_amount: 45\n    structured_facts:\n      disputeStatus: \"denied\"\n    order_id: \"DO-DD06-denied-appeal-offered\"\nexpected:\n  recommendation: \"dispute\"\n  draft: \"present\"\n  customer_comment: null\n  rubric:\n    - id: \"appeal_route\"\n      criterion: \"Recommend using the visible Appeal decision action and write for an appeal of the denial.\"\n    - id: \"supporting_evidence\"\n      criterion: \"Use the packing record as support. Do not claim a file was uploaded or guarantee recovery.\"\n"}, {"id": "doordash-quality-late-pickup", "title": "Quality late pickup", "coverage": "DD-07", "platform": "doordash", "source": "PostgreSQL DB (adapted)", "verdict": "dispute", "draft": "present", "comment": null, "query": null, "notes": "Real food-quality charge and pickup times. The captured route was closed. This variant makes the dispute route open to isolate the delay calculation.", "criteria": ["Identify 6:32 PM and 6:48 PM as quoted and actual pickup and state the 16-minute delay. Treat the delay as relevant evidence, without asserting it proved the cause."], "entryPoint": null, "followUps": [], "raw": "id: doordash-quality-late-pickup\ncoverage: DD-07\nsource: PostgreSQL DB (adapted)\ninput:\n  query: null\n  page_text: doordash-quality-late-pickup.txt\n  capture:\n    platform: doordash\n    issue_category: Food quality\n    dispute_amount: 15.11\n    structured_facts:\n      disputeStatus: available\n      errorChargeTotal: -15.11\n      errorCharges:\n      - item: Paneer Butter Masala (Roadside Curries)\n        amount: -14.4\n      items:\n      - name: Paneer Butter Masala (Roadside Curries)\n        quantity: 2\ <script>
'use strict';
const { cases, matrix } = JSON.parse(document.getElementById('catalog-data').textContent);
const get = id => document.getElementById(id);
const platforms = { doordash: 'DoorDash', ubereats: 'Uber Eats' };
const selectedCases = new Set(matrix.scenarios);
const verdicts = { dispute: 'Dispute', goodwill: 'Goodwill', do_not_dispute: 'Don’t dispute', needs_review: 'Needs review' };
const add = (parent, tag, value, className) => {
  const node = document.createElement(tag);
  if (value !== undefined) node.textContent = value;
  if (className) node.className = className;
  parent.append(node);
  return node;
};
get('total').textContent = cases.length;
get('scheduled').textContent = selectedCases.size;
get('outside').textContent = cases.length - selectedCases.size;
get('footer').textContent = `Matrix: ${matrix.repeats} repeats per selected scenario · Judge: Grok 4.7 High · Snapshot of local YAML files`;

let active = cases.find(item => selectedCases.has(item.id));
let showYaml = false;
let copyFeedback;
const matches = item => {
  const term = get('search').value.toLowerCase().trim();
  const mode = get('matrix').value;
  return (!term || `${item.title} ${item.raw}`.toLowerCase().includes(term))
    && (!get('platform').value || item.platform === get('platform').value)
    && (!get('source').value || item.source === get('source').value)
    && (!mode || selectedCases.has(item.id) === (mode === 'in'));
};

function setTab(isYaml) {
  showYaml = isYaml;
  get('overview-tab').setAttribute('aria-pressed', String(!isYaml));
  get('yaml-tab').setAttribute('aria-pressed', String(isYaml));
  get('overview').hidden = isYaml;
  for (const id of ['yaml', 'copy', 'download']) get(id).hidden = !isYaml;
}
function showDetails() {
  clearTimeout(copyFeedback);
  get('copy').textContent = 'Copy YAML';
  get('detail').hidden = !active;
  get('empty').hidden = Boolean(active);
  if (!active) return;
  const item = active;
  const inMatrix = selectedCases.has(item.id);
  get('detail-meta').textContent = `${item.coverage} · ${platforms[item.platform]} · ${inMatrix ? 'In matrix' : 'Outside matrix'}`;
  get('detail-title').textContent = item.title;
  const overview = get('overview');
  overview.replaceChildren();
  const meta = add(overview, 'dl', undefined, 'meta');
  for (const [label, value] of [
    ['Fixture source', item.source === 'synthetic' ? 'Synthetic' : item.source],
    ['Expected verdict', verdicts[item.verdict] || 'No agent call'],
    ['Expected draft', item.draft === 'present' ? 'Present' : 'Absent'],
    ['Entry point', item.entryPoint === 'sidebar_capture' ? 'Sidebar capture' : item.followUps.length ? 'Agent + follow-up' : 'Agent'],
  ]) {
    const field = add(meta, 'div');
    add(field, 'dt', label);
    add(field, 'dd', value);
  }
  add(overview, 'h3', 'Operator query');
  add(overview, 'p', item.entryPoint === 'sidebar_capture' ? 'No query sent.' : item.query || 'Check this charge (default starter)');
  if (item.comment) {
    add(overview, 'h3', 'Expected customer quote');
    add(overview, 'p', item.comment);
  }
  add(overview, 'h3', 'Grading criteria');
  const criteria = add(overview, 'ul');
  for (const criterion of item.criteria) add(criteria, 'li', criterion);
  for (const [index, turn] of item.followUps.entries()) {
    add(overview, 'h3', item.followUps.length === 1 ? 'Follow-up' : `Follow-up ${index + 1}`);
    add(overview, 'p', turn.query);
    for (const criterion of turn.criteria) add(overview, 'p', criterion, 'notes');
  }
  if (item.notes) add(overview, 'p', item.notes, 'notes');
  const code = get('code');
  code.replaceChildren();
  const lines = item.raw.split('\n');
  for (const [index, line] of lines.entries()) {
    const key = line.match(/^(\s*(?:- )?[\w_]+:)(.*)$/);
    if (key) add(code, 'span', key[1], 'key');
    code.append(document.createTextNode((key ? key[2] : line) + (index < lines.length - 1 ? '\n' : '')));
  }
  get('overview').scrollTop = 0;
  get('yaml').scrollTop = 0;
  setTab(showYaml);
}
function render() {
  const visible = cases.filter(matches);
  if (!active || !visible.includes(active)) active = visible[0];
  get('count').textContent = `${visible.length} of ${cases.length} scenarios`;
  const index = get('index');
  index.replaceChildren();
  for (const [platform, label] of Object.entries(platforms)) {
    const items = visible.filter(item => item.platform === platform);
    if (!items.length) continue;
    add(index, 'h3', `${label} · ${items.length}`, 'group');
    for (const item of items) {
      const row = add(index, 'button', undefined, 'row');
      row.type = 'button';
      row.setAttribute('aria-current', String(item === active));
      add(row, 'strong', item.title);
      const meta = add(row, 'small', item.coverage);
      if (selectedCases.has(item.id)) add(meta, 'span', ' · In matrix', 'listed');
      row.onclick = () => {
        index.querySelector('[aria-current="true"]')?.setAttribute('aria-current', 'false');
        row.setAttribute('aria-current', 'true');
        active = item;
        showDetails();
      };
    }
  }
  index.hidden = !visible.length;
  showDetails();
}
get('search').addEventListener('input', render);
for (const id of ['platform', 'source', 'matrix']) get(id).addEventListener('change', render);
get('overview-tab').onclick = () => setTab(false);
get('yaml-tab').onclick = () => setTab(true);
get('copy').onclick = async () => {
  if (!active) return;
  const raw = active.raw;
  try {
    await navigator.clipboard.writeText(raw);
    get('copy').textContent = 'Copied';
    get('announce').textContent = 'YAML copied.';
  } catch {
    const range = document.createRange();
    range.selectNodeContents(get('code'));
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    get('copy').textContent = 'YAML selected';
    get('announce').textContent = 'YAML selected. Use your browser’s copy shortcut.';
  }
  clearTimeout(copyFeedback);
  copyFeedback = setTimeout(() => { get('copy').textContent = 'Copy YAML'; }, 2200);
};
get('download').onclick = () => {
  if (!active) return;
  const url = URL.createObjectURL(new Blob([active.raw], { type: 'application/yaml' }));
  const link = document.createElement('a');
  link.href = url;
  link.download = `${active.id}.yaml`;
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};
render();
</script>
