# One of the allowed customisations: a filtered view for one store.
version: 1
id: payout-custom-one-store
title: "Owner asks for the issues Excel for one store only"
use_case: payout-reconciliation
classification:
  trigger: user
  goals: [customise, create_artifact]
  patterns: [single_turn, allowed_filter, artifact]
restaurant: Harbor Tea
pos: Square
period:
  from: 2026-10-19
  to: 2026-10-25
skill: skills/payout-reconciliation.md
data:
  - data/week-2026-10-19/reconciliation_result.json
  - data/week-2026-10-19/orders.csv
runs: 30
conversation:
  - id: downtown-excel
    user: "Give me the Excel for just the Downtown store."
    expect:
      artifact:
        type: excel
        rows: 6
        order_ids: [AC51D, 6F5CF287, 4107CE2A, B20C9D2D, 4C90C117, 4EF2E3A1]
        total_amount: "110.17"
        stores: [Downtown]          # no other store may appear
        columns_include: [app, order_date, order_time, order_id, app_amount]
      response:
        judge: llm
        criteria: |-
          Produces an Excel file with exactly the 6 Downtown orders not recorded in Square, totalling $110.17.
          Includes no orders from Northside, Westside or Beachside, and no matched orders.
          The chat reply is short: says what the file contains and for which week.
          Does not say who the file should be sent to.
          Does not ask unnecessary questions before producing it.
