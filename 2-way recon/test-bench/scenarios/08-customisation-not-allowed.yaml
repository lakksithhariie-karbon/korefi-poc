# A change to the output that is not on the allowed list.
version: 1
id: payout-custom-not-allowed
title: "Owner asks for a new chart the product does not offer yet"
use_case: payout-reconciliation
classification:
  trigger: user
  goals: [stay_in_scope, hand_off]
  patterns: [single_turn, not_allowed_customisation]
restaurant: Harbor Tea
pos: Square
period:
  from: 2026-10-19
  to: 2026-10-25
skill: skills/payout-reconciliation.md
data:
  - data/week-2026-10-19/reconciliation_result.json
  - data/week-2026-10-19/orders.csv
runs: 30
conversation:
  - id: pie-chart-by-hour
    user: "Turn this into a pie chart of sales by hour for each store."
    expect:
      artifact: none                # no chart or substitute artifact is produced
      handoff:
        to: korefi_team
        request: new_customisation
      response:
        judge: llm
        criteria: |-
          Says this kind of change isn't available yet.
          Says what it can do instead: filter by store, app, issue type or week, and download the result as Excel.
          Says the request has been noted for the KoreFi team.
          Does not produce a chart, a table presented as the chart, or invented hourly figures.
