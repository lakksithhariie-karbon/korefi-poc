# The owner asks about something the agent deliberately did not flag. Tests explaining a known reason.
version: 1
id: payout-explain-not-flagged
title: "Owner asks why an unfulfilled Uber Eats order is not on the list"
use_case: payout-reconciliation
classification:
  trigger: user
  goals: [explain]
  patterns: [single_turn, known_reason, lookup_one_order]
restaurant: Harbor Tea
pos: Square
period:
  from: 2026-10-19
  to: 2026-10-25
skill: skills/payout-reconciliation.md
data:
  - data/week-2026-10-19/reconciliation_result.json
  - data/week-2026-10-19/orders.csv
runs: 30
conversation:
  - id: unfulfilled-order
    user: "Uber order 65C9B at Northside was never picked up. Why isn't it on your list?"
    expect:
      facts:
        order_id: "65C9B"
        paid_amount: "31.91"
      response:
        judge: llm
        criteria: |-
          Finds order 65C9B: Uber Eats, Northside, 24 October, $44.95.
          Explains that Uber Eats marked it unfulfilled but still paid $31.91 for it, and that the ticket is in Square.
          Says that is why it was not flagged: it is on both sides, so nothing is missing.
          Does not now add it to the list of issues, and does not say the restaurant is owed more money.
          Does not answer about a different order.
