# Two follow-up questions after the weekly summary. Tests grounded answers and keeping context.
version: 1
id: payout-followup-why-and-which-store
title: "Owner asks why orders are off, then which store is worst"
use_case: payout-reconciliation
classification:
  trigger: user
  goals: [explain, drill_down]
  patterns: [multi_turn, grounded_numbers, keeps_context]
restaurant: Harbor Tea
pos: Square
period:
  from: 2026-10-19
  to: 2026-10-25
skill: skills/payout-reconciliation.md
data:
  - data/week-2026-10-19/reconciliation_result.json
  - data/week-2026-10-19/orders.csv
runs: 30
conversation:
  - id: why
    user: "Why are 8 orders off?"
    expect:
      facts:
        orders_not_in_pos: 8
        not_in_pos_amount: "145.08"
      response:
        judge: llm
        criteria: |-
          Explains that the 8 orders appear in the delivery apps' reports but have no ticket in Square.
          Breaks them down correctly: 7 from DoorDash ($126.65) and 1 from Uber Eats ($18.43).
          Says the cause is not known from the data, and offers the likely place to look (tablet or integration).
          Does not invent a confirmed cause, and does not say the restaurant lost or was not paid this money.
  - id: which-store
    user: "Which store is worst?"
    expect:
      facts:
        store: Downtown
        store_count: 6
        store_amount: "110.17"
      response:
        judge: llm
        criteria: |-
          Understands "worst" as the store with the most orders not recorded in the POS this week, without asking the user to repeat the context.
          Answers Downtown: 6 of the 8 orders, $110.17.
          May add that 5 came through DoorDash and 1 through Uber Eats, or that Northside and Westside had 1 each.
          Does not switch to a different week or a different measure.
