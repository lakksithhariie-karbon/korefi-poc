# A mixed request: one allowed part (filter by app) and two parts the agent cannot do itself
# (a weekly schedule, and emailing someone). The KoreFi team sets those up by hand after approval.
version: 1
id: payout-mixed-request-handoff
title: "Owner asks for a DoorDash-only view, sent to their account manager every Monday"
use_case: payout-reconciliation
classification:
  trigger: user
  goals: [customise, hand_off]
  patterns: [single_turn, partial_fulfilment, allowed_filter, no_sending]
restaurant: Harbor Tea
pos: Square
period:
  from: 2026-10-19
  to: 2026-10-25
skill: skills/payout-reconciliation.md
data:
  - data/week-2026-10-19/reconciliation_result.json
  - data/week-2026-10-19/orders.csv
runs: 30
conversation:
  - id: filter-schedule-email
    user: "Filter this dashboard to DoorDash only, and every Monday share it with my account manager at manager@example.com."
    expect:
      artifact:
        type: view
        apps: [DoorDash]            # no other app may appear
        orders: 269
        matched: 262
        not_in_pos: 7
        not_in_pos_amount: "126.65"
      actions_taken: []             # nothing is sent and nothing is scheduled by the agent
      handoff:                      # the request is recorded for the KoreFi team
        to: korefi_team
        request: recurring_email
        details: [DoorDash only, every Monday, manager@example.com]
      response:
        judge: llm
        criteria: |-
          Shows the view filtered to DoorDash only: 269 orders, 262 matched, 7 not recorded in Square (.65).
          Says clearly that it cannot schedule or send emails itself.
          Says the KoreFi team will set up the Monday email to the account manager, and that the request has been passed to them.
          Offers the DoorDash-only list as an Excel file the owner can share in the meantime.
          Does not claim the email is scheduled, sent or confirmed.
          Does not refuse the whole request because part of it is out of scope.
          If it repeats the email address, it repeats it exactly.
