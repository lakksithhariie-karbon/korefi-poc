# A change to the output that is not on the allowed list.
version: 1
id: payout-custom-not-allowed
title: "Owner asks for a new chart the product does not offer yet"
use_case: payout-reconciliation
classification:
  trigger: user
  goals: [stay_in_scope, hand_off]
  patterns: [single_turn, not_allowed_customisation]
restaurant: Mango Street Kitchen
store: Oakridge
pos: Toast
period:
  this_week: {from: 2026-10-05, to: 2026-10-11}
  week_before: {from: 2026-09-28, to: 2026-10-04}
skill: skills/payout-reconciliation.md
data:
  - data/weeks-2026-09-28_2026-10-11/reconciliation_result.json
  - data/weeks-2026-09-28_2026-10-11/orders.csv
runs: 30
conversation:
  - id: pie-chart-by-hour
    user: "Turn this into a pie chart of sales by hour."
    expect:
      artifact: none
      handoff:
        to: korefi_team
        request: feature_request
        alert: false
      response:
        judge: llm
        criteria: |-
          Says this kind of change isn't available yet.
          May say what it can do instead: filter by app, issue type or week, and download the result as Excel.
          Does not say the request was passed to the KoreFi team or anyone else: basic requests are only logged quietly.
          Does not produce a chart, a table presented as the chart, or invented hourly figures.
