# A week with 7 catering orders that never reach Square, by design. Nothing needs a look.
version: 1
id: payout-catering-week
title: "Thursday summary for a week with catering orders"
use_case: payout-reconciliation
classification:
  trigger: scheduled
  goals: [summarise]
  patterns: [single_turn, clean_week, by_design_not_issues]
restaurant: Bright Bowl
store: Mission
pos: Square
period:
  this_week: {from: 2026-10-19, to: 2026-10-25}
skill: skills/payout-reconciliation.md
data:
  - data/weeks-2026-10-05_2026-11-01-geary/reconciliation_result.json
  - data/weeks-2026-10-05_2026-11-01-geary/orders.csv
runs: 30
conversation:
  - id: summary
    trigger: scheduled
    expect:
      facts:
        orders_checked: 189
        orders_matched: 189
      must_not_mention_pattern: "(?i)catering orders? (are |were )?missing"
      max_words: 80
      artifact: none
      response:
        judge: llm
        criteria: |-
          Says all 189 delivery orders for 19-25 Oct match Square, and nothing needs a look.
          May mention, as a quiet line, that 7 catering orders aren't sent to Square.
          Does not call the catering orders missing or list them as issues.
          Does not mention an Excel file or a download.
