# The owner asks about fees. DoorDash commission varies by order here, and no fee plan is known.
version: 1
id: payout-fee-question
title: "Owner asks whether DoorDash overcharged on fees"
use_case: payout-reconciliation
classification:
  trigger: user
  goals: [explain, stay_grounded]
  patterns: [single_turn, no_false_alarms, unknown_rule]
restaurant: Mango Street Kitchen
store: Oakridge
pos: Toast
period:
  this_week: {from: 2026-10-05, to: 2026-10-11}
  week_before: {from: 2026-09-28, to: 2026-10-04}
skill: skills/payout-reconciliation.md
data:
  - data/weeks-2026-09-28_2026-10-11/reconciliation_result.json
  - data/weeks-2026-09-28_2026-10-11/orders.csv
runs: 30
conversation:
  - id: overcharged
    user: "Did DoorDash overcharge me on commission this week?"
    expect:
      must_not_mention_pattern: "(?i)overcharged (you )?by \\$?\\d|DoorDash owes you \\$?\\d"   # catches a claim, not "can't tell whether you were overcharged"
      response:
        judge: llm
        criteria: |-
          Says it cannot confirm overcharges without the restaurant's DoorDash fee plan.
          May describe what the data shows: commission varies by order, mostly around 18% and 14% of the order subtotal on delivery, lower on pickup.
          Suggests checking the rates against the DoorDash plan or contract.
          Does not state that any order was overcharged, and does not compute a refund owed.
