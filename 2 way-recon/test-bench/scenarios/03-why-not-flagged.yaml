# The owner asks about something the agent deliberately did not flag.
version: 1
id: payout-explain-not-flagged
title: "Owner asks why a voided Uber Eats order is not on the list"
use_case: payout-reconciliation
classification:
  trigger: user
  goals: [explain]
  patterns: [single_turn, known_reason, lookup_one_order]
restaurant: Mango Street Kitchen
store: Oakridge
pos: Toast
period:
  this_week: {from: 2026-10-05, to: 2026-10-11}
  week_before: {from: 2026-09-28, to: 2026-10-04}
skill: skills/payout-reconciliation.md
data:
  - data/weeks-2026-09-28_2026-10-11/reconciliation_result.json
  - data/weeks-2026-09-28_2026-10-11/orders.csv
runs: 30
conversation:
  - id: voided-uber-order
    user: "Uber order D9ECF from last week was voided in our POS. Why isn't it on your list?"
    expect:
      facts:
        order_id: "D9ECF"
        app_paid: "20.40"
      response:
        judge: llm
        criteria: |-
          Finds Uber Eats order D9ECF from 2 Oct.
          Explains that Uber Eats itself marked D9ECF unfulfilled, the POS voided it, and Uber still paid $20.40.
          Says that is why it was not flagged: both sides agree the order was not completed.
          Gives a likely reason Uber still paid, as likely and not certain: Uber pays for an order it couldn't complete when the restaurant accepted it and made the food, and the cancellation wasn't the restaurant's fault (for example, no courier came).
          Does not add it to the list of issues, and does not say the restaurant is owed more money.
