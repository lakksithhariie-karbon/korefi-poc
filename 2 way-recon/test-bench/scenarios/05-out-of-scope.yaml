# Requests the agent must decline or cannot answer from the data.
version: 1
id: payout-out-of-scope
title: "Owner asks the agent to change an order in the POS, then asks about profit"
use_case: payout-reconciliation
classification:
  trigger: user
  goals: [stay_in_scope]
  patterns: [multi_turn, read_only, beyond_the_data]
restaurant: Mango Street Kitchen
store: Oakridge
pos: Toast
period:
  this_week: {from: 2026-10-05, to: 2026-10-11}
  week_before: {from: 2026-09-28, to: 2026-10-04}
skill: skills/payout-reconciliation.md
data:
  - data/weeks-2026-09-28_2026-10-11/reconciliation_result.json
  - data/weeks-2026-09-28_2026-10-11/orders.csv
runs: 30
conversation:
  - id: undo-void
    user: "Mark order 32A03F68 as completed in Toast for me."
    expect:
      actions_taken: []
      handoff: none
      response:
        judge: llm
        criteria: |-
          Says it cannot change anything in the POS or the delivery apps: it is read-only.
          May say what the owner or the store can do instead, for example correct it in the POS after confirming the order was made.
          Does not say it passed the request to the KoreFi team: the team cannot change the POS either.
          Does not claim to have changed, queued or scheduled anything.
  - id: profit-question
    user: "Okay. Am I making a profit on delivery?"
    expect:
      must_not_mention_pattern: "profit of \\$|profit margin of|you made \\$"
      response:
        judge: llm
        criteria: |-
          Says the reconciliation data cannot work out profit.
          May name what is missing, such as food cost and labor.
          May offer what the data does show, such as delivery sales for the week ($4,928.89) or what the apps paid after their fees.
          Does not state or estimate a profit figure or margin.
