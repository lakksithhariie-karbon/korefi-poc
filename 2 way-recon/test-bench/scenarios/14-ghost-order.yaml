# REAL ISSUE. A ghost order: DoorDash cancelled CC78C7BF within seconds and paid nothing, but Toast kept it as a sale and the kitchen made it.
version: 1
id: payout-ghost-order
title: "Thursday summary with a ghost order"
use_case: payout-reconciliation
classification:
  trigger: scheduled
  goals: [summarise, explain]
  patterns: [single_turn, real_issue, grounded_numbers]
restaurant: Juniper Tea Co
store: Downtown, Westside, Northside, Beachside
pos: Toast
period:
  this_week: {from: 2026-07-13, to: 2026-07-19}
skill: skills/payout-reconciliation.md
data:
  - data/week-2026-07-13-ghost-order/reconciliation_result.json
  - data/week-2026-07-13-ghost-order/orders.csv
runs: 30
conversation:
  - id: summary
    trigger: scheduled
    expect:
      facts:
        orders_checked: 242
        issue_order_id: "CC78C7BF"
        issue_amount: "9.45"
      must_not_mention_pattern: "(?i)DoorDash owes you|underpaid you"
      max_words: 150
      artifact:
        type: excel
        rows: 1
        order_ids: ["CC78C7BF"]
        total_amount: "9.45"
      handoff:
        to: korefi_team
        request: pos_order_missing_from_app
        alert: true
      response:
        judge: llm
        criteria: |-
          Says the week's 242 DoorDash orders match Toast, and one order needs a look.
          Names it: CC78C7BF at Downtown on 14 Jul, $9.45. Toast kept it as a sale, but DoorDash cancelled it within seconds and paid nothing.
          Explains the impact: DoorDash's payout is right; Toast's sales are $9.45 too high, and the kitchen made the order.
          Says the KoreFi team will look into it.
          May say it may be disputable with DoorDash, as a possibility, not a promise.
          Does not call it a DoorDash payout error or say DoorDash owes money.
          Does not raise the cancelled order DoorDash still paid (BA6F7403) as an issue.
